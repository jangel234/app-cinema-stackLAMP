version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: taquilla_web
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: taquilla_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    environment:
      MYSQL_DATABASE: cine
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: usuario_cine
      MYSQL_PASSWORD: contraseña_segura
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/cine.sql:/docker-entrypoint-initdb.d/init.sql

  # NUEVO: Interfaz gráfica para la base de datos
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: taquilla_pma
    links:
      - db
    environment:
      PMA_HOST: db
      PMA_ARBITRARY: 1
      PMA_CHARSET: utf8mb4 
      PMA_COLLATION: utf8mb4_unicode_ci
      PMA_USER: root
      PMA_PASSWORD: root_password
    volumes:
      - ./phpmyadmin-charset.php:/etc/phpmyadmin/conf.d/charset.php
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data:
